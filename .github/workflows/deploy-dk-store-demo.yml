name: Deploy DK Store free demo

on:
  push:
    branches: [main]
    paths:
      - "Downloads/dk-store-react/dk-store-react/free-site/**"
      - ".github/workflows/deploy-dk-store-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Downloads/dk-store-react/dk-store-react/free-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
